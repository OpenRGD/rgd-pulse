[package]
name = "pulse-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Synthetic host bridge demo for OpenRGD Pulse"

[dependencies]
serialport = { version = "4.8", default-features = false }
pulse-core = { path = "../pulse-core" }
pulse-protocol = { path = "../pulse-protocol" }
pulse-ui = { path = "../pulse-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
