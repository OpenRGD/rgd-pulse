name: PULSE 0.3B one-shot rustfmt
on:
  push:
    branches: [feat/pulse-0.3b-console-imu-live]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pulse-0.3b-console-imu-live
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format only shared host/firmware source
        run: |
          cargo fmt --all
          (cd firmware/pico-w && cargo fmt --all)
          if ! git diff --quiet -- crates/ firmware/pico-w/src/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/ firmware/pico-w/src/
            git commit -m "style(pulse-0.3b): rustfmt Console parser, IMU wire and firmware"
            git push origin HEAD:feat/pulse-0.3b-console-imu-live
          fi
