name: Pico firmware compile
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  pico:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/pico-w
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
      - name: Build RP2040 firmware ELF (linker included)
        run: cargo build --release
