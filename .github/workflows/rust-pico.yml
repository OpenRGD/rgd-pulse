name: Pico firmware compile
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  pico:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/pico-w
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv6m-none-eabi
          components: llvm-tools-preview
      - name: Build RP2040 firmware ELF (linker included)
        run: cargo build --release
      - name: Assert RP2040 BOOT2 and vector table flash addresses
        run: |
          OBJDUMP="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-objdump"
          "$OBJDUMP" -h target/thumbv6m-none-eabi/release/pulse-pico-w | tee /tmp/pulse-sections.txt
          python3 - <<'PY'
          from pathlib import Path

          lines = Path("/tmp/pulse-sections.txt").read_text().splitlines()

          def section(name):
              for line in lines:
                  parts = line.split()
                  if len(parts) >= 4 and parts[1] == name:
                      return int(parts[2], 16), int(parts[3], 16)
              raise SystemExit(f"Missing ELF section: {name}")

          boot_size, boot_address = section(".boot2")
          vectors_size, vectors_address = section(".vector_table")
          assert boot_size == 0x100, f"BOOT2 size {boot_size} != 256"
          assert boot_address == 0x10000000, hex(boot_address)
          assert vectors_address == 0x10000100, hex(vectors_address)
          assert vectors_size > 0, "Empty Cortex-M vector table"
          # Every section loaded into XIP flash must stop below the
          # 8KiB dual-sector persistence partition (0x101fe000).
          prefs_begin = 0x101fe000
          flash_begin = 0x10000000
          flash_end = 0x10200000
          checked = 0
          for line in lines:
              parts = line.split()
              if len(parts) < 5 or not parts[0].isdigit():
                  continue
              try:
                  size = int(parts[2], 16)
                  lma = int(parts[4], 16)
              except ValueError:
                  continue
              if flash_begin <= lma < flash_end and size:
                  assert lma + size <= prefs_begin, (
                      f"ELF section {parts[1]} flash LMA 0x{lma:x}+0x{size:x} "
                      f"overlaps protected preferences at 0x{prefs_begin:x}"
                  )
                  checked += 1
          assert checked >= 2, "No flash-load sections were checked"
          print(f"Persistence partition safe: {checked} flash-load sections end before 0x{prefs_begin:x}")
          print("RP2040 boot layout validated: BOOT2 256 bytes @ 0x10000000; vectors @ 0x10000100")
          PY
