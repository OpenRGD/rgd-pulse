name: One-shot rustfmt IMU handoff
on:
  push:
    branches: [feat/pulse-0.3a-imu-observation-model]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pulse-0.3a-imu-observation-model
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply rustfmt once to host/offline IMU model
        run: |
          cargo fmt --all
          if ! git diff --quiet -- crates/pulse-ui/ crates/pulse-bridge/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/pulse-ui/ crates/pulse-bridge/
            git commit -m "style(imu): rustfmt shared model and offline sample parser"
            git push origin HEAD:feat/pulse-0.3a-imu-observation-model
          fi
