name: One-shot rustfmt (feature branch)
on:
  push:
    branches:
      - feat/pulse-0.2b-chronoscope-four-pages

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pulse-0.2b-chronoscope-four-pages
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Autoformat navigation crate
        run: |
          cargo fmt --all
          if ! git diff --quiet -- crates/pulse-ui/src/lib.rs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/pulse-ui/src/lib.rs
            git commit -m "style(ui): apply rustfmt to navigation crate"
            git push origin HEAD:feat/pulse-0.2b-chronoscope-four-pages
          fi
