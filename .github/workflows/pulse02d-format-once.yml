name: One-shot rustfmt 0.2D
on:
  push:
    branches: [feat/pulse-0.2d-navigation-skins]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pulse-0.2d-navigation-skins
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Autoformat pulse-ui only
        run: |
          cargo fmt --all
          if ! git diff --quiet -- crates/pulse-ui/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/pulse-ui/
            git commit -m "style(pulse-0.2d): apply rustfmt to UI modules"
            git push origin HEAD:feat/pulse-0.2d-navigation-skins
          fi
