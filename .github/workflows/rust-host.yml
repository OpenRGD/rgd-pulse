name: Rust host tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test host workspace
        run: cargo test --workspace
      - name: Format host workspace
        run: cargo fmt --all -- --check
      - name: Validate Pulse K3 source readiness guard (offline)
        run: python3 -m unittest discover -s scripts -p 'test_pulse_mux_imu_preflight.py' -v
      - name: Validate operator-only mux acceptance script syntax
        run: bash -n scripts/pulse-mux-acceptance.sh
